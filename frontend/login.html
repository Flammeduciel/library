<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — BiblioQuartier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/style.css">
</head>
<body id="page-login">

<div class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark"><i class="fa-solid fa-book-open"></i></div>
      <div class="brand-name"><b>BiblioQuartier</b><span>Gestion de bibliothèque</span></div>
    </div>
    <form class="login-form" id="login-form">
      <div class="alert danger" id="login-error" hidden></div>
      <label>Email<input class="field" id="login-email" type="email" autocomplete="username" placeholder="admin@biblio.fr"></label>
      <label>Mot de passe<input class="field" id="login-password" type="password" autocomplete="current-password" placeholder="••••••••"></label>
      <button class="btn accent block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Se connecter</button>
      <p class="login-hint">Démo — admin@biblio.fr / superadmin123 · biblio@biblio.fr / biblio123</p>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
